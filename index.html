<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>

    <!-- Hero Section -->
    <div id="hero-section-div"></div>
    <div id="bum"></div>


    <!-- Featured Growth Section -->
    <div id="featured-projects-section" style="background-color: var(--dark-grey);">
      <h1 class="text-center" style="color:white; padding: 2rem 0px;"> Featured Growths / Mindsets</h1>
      <div id="featured-section-container">
        <div id="featured-projects-container" class="center-content"></div>
      </div>
    </div>


    <!-- All Projects Section -->
    <div id="all-projects-section" class="projects-section">
      <div>
        <h1 class="text-center" style="padding:1.5rem;">All Projects</h1>
      </div>
      <div class="flex-box">
        <button
          id="softwareProjectButton"
          style="background-color: var(--avery)"
        >
          Software
        </button>
        <button
          id="firmwareProjectButton"
          style="background-color: var(--mango)"
        >
          Firmware
        </button>
        <button
          id="hardwareProjectButton"
          style="background-color: var(--tangerine)"
        >
          Hardware
        </button>
        <button
          id="fpgaProjectButton"
          style="background-color: var(--tango-pink)"
        >
          FPGA
        </button>
      </div>
      <div id="portfolio-container" class="center-content"></div>
    </div>


    <!-- Beyond Work Section -->
    <div id="beyond-work" style="height:100vh;">
      <h1 style="text-align: center;">Beyond Work</h1>
      <div id="beyond-work-container" class="center-content"></div>
    </div>


    <!-- Queries Section -->

    
    <!-- Footer -->

    <!-- Menu -->
    <button class="menu-btn"></button>
    <div id="menu-background" class="hidden">
      <div id="menu-container">
        <a href="#hero-section"><h1 id="1" style="cursor: pointer;">Intro</h1></a>
        <a href="#featured-projects-section"><h1 id="2"style="cursor: pointer;">Featured</h1></a>
        <a href="#all-projects-section"><h1 id="3" style="cursor: pointer;">All Projects</h1></a>
        <a href="#beyond-work"><h1 id="4" style="cursor: pointer;">Beyond Work</h1></a>
        <a href="#hero-section"><h1 id="5" style="cursor: pointer;">Contact Me</h1></a>
      </div>
    </div>

    <script src="scripts/main.js" defer></script>
  </body>
</html>
